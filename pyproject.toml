[project]
name = "phansora-api"
version = "0.1.0"
description = "Phansora platform API — unified backend for SpokenVerse, Chrono-Origin and Dossier Nova."
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"

# The full, install-order-sensitive dependency set (incl. the torch CUDA index)
# lives in requirements.txt. Install with:  pip install -r requirements.txt
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "python-dotenv",
    "httpx",
    "aiohttp",
    "tenacity",
    "orjson",
    "openai>=2.0.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.scripts]
phansora = "phansora.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus bugbear and the async checks. Run as CI does with
#   ruff check
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]
ignore = [
    # Style, not bugs.
    "E702",  # two statements on one line with `;`
    "E731",  # a lambda bound to a name
    "E741",  # `l` and `I` as names
    # File(), Form() and Depends() in a parameter's default is how FastAPI declares inputs.
    "B008",
    # zip(strict=True) raises on a length mismatch; adding it would change what runs.
    "B905",
    # pathlib's exists()/stat() inside an async handler: local metadata, microseconds.
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
# Imports below a pytest.importorskip(...), which has to run first.
"tests/**" = ["E402"]
# These call load_dotenv() before importing anything that reads the environment.
"src/phansora/products/chrono_origin/server.py" = ["E402"]
"src/phansora/products/narrava_studio/server.py" = ["E402"]
