# api.phansora.com — the FastAPI app behind nginx.
#
# Captured from the live server so the CORS-preflight change below is reviewable rather
# than typed into /etc by hand. Apply with:
#   scp deploy/nginx/api.phansora.com.conf root@phansora.com:/etc/nginx/conf.d/
#   ssh root@phansora.com 'nginx -t && systemctl reload nginx'

# Which origins may call the API from a browser. Mirrors CORS_ALLOW_ORIGINS in the API's
# .env — the app is still the authority for real requests; this exists only so a preflight
# can be answered without waking it.
map $http_origin $api_cors_origin {
    default                        "";
    "https://phansora.com"         $http_origin;
    "https://www.phansora.com"     $http_origin;
}

server {
    if ($host = api.phansora.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.phansora.com;

    return 301 https://api.phansora.com$request_uri;


}

server {
    listen 443 ssl http2;
    server_name api.phansora.com;
    ssl_certificate /etc/letsencrypt/live/phansora.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/phansora.com/privkey.pem; # managed by Certbot
    
    client_max_body_size 352m;

    location / {
        # ANSWER CORS PREFLIGHT HERE, do not proxy it.
        #
        # This is the fix for "Couldn't reach the voice service." A browser calling
        # api.phansora.com from phansora.com must send an OPTIONS preflight before any
        # request carrying an Authorization header. That preflight was going through to
        # the app — which runs a single worker shared by every product — so while a Book
        # Alchemy job had the worker busy synthesising, the preflight sat in the queue.
        #
        # A preflight that does not come back does not produce a status code. The browser
        # reports the whole fetch as a network error, so the page says it could not REACH
        # a service that was merely busy, and nothing is written to the API's access log
        # because the request was never served. That is why this failure left no trace.
        #
        # A preflight is a question about policy, not about the resource, and its answer
        # never depends on application state. Answering it at the edge means a saturated
        # API stays reachable: you get a slow response or an honest 503, which the page
        # can explain, instead of a network error it cannot.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $api_cors_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Phansora-Priority, x-phansora-internal-key" always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Vary                             "Origin" always;
            add_header Content-Length                   0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout   300s;    # was ~60s default
        proxy_send_timeout   300s;
        proxy_connect_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
